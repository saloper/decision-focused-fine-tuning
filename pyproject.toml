[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-focused-fine-tuning"
version = "0.1.0"
description = "Fine-tuning foundation time series models on decision loss for battery arbitrage"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",      
    "openpyxl>=3.1.0",     
    "pyyaml>=6.0",          
    "cvxpy>=1.3.0",
    "momentfm>=0.1.0",      
    "jupyter>=1.0.0"        
]
