[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-focused-fine-tuning"
version = "0.1.0"
description = "Fine-tuning foundation time series models on decision loss for battery arbitrage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "pandas>=2.0.0",
    "numpy >= 1.22.4",
    "pyarrow>=14.0.0",      
    "openpyxl>=3.1.0",     
    "pyyaml>=6.0",          
    "cvxpy>=1.7.4",
    #"diffcp >= 1.1.0", #need c++ complier
    "momentfm>=0.1.0",   # for MOMENT foundation model
    "tqdm>=4.65.0",      # for progress bars
    "scikit-learn>=1.3.0", # for metrics/utilities if needed
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0", # for plotting if needed
    "seaborn>=0.12.0",   # for visualization (optional)
    "peft>=0.11.1",
    "transformers>=4.40.2",
    "accelerate>=0.30.1",
    "plotly>=6.6.0",
    "timesf
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dfft*"]