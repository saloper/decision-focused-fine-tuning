#Metadata
experiment_name: "baseline"

paths:
  raw_input_path: "data/raw/"
  processed_intput_path: "data/processed/"
  input_filename: "NEMA_LMP.parquet"

data:
  train_start_date: '2017-01-01' #Start and End dates are inclusive
  train_end_date: '2024-12-31'
  test_start_date: '2025-01-01'
  test_end_date: '2025-12-31'
  input_width: 512 #numer of horizons passed as an input
  output_width: 24 #number of horizons to predict in future
  batch_size: 32

training:
  epochs: 50
  learning_rate: 0.001
  loss_function: "mse" 